[pytest]
# Discover tests under the tests/ directory
testpaths = tests

# Naming conventions
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output by default; short traceback for readability
addopts = -v --tb=short

# Ensure test_edge_cases.py runs first (alphabetical order guarantees this)
# Files run in order: test_edge_cases -> test_api_* -> test_csv_* -> test_security -> test_static -> test_total -> test_validation

